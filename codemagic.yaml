workflows:
  android:
    name: Build APK for Android
    environment:
      vars:
        EXPO_TOKEN: $EXPO_TOKEN  # استفاده از توکن Expo از متغیرهای محیطی
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install EAS CLI
        script: |
          npm install -g eas-cli
      - name: Build APK
        script: |
          eas build --platform android
